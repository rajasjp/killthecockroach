<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kill The Cockroach</title>
  <style>
    :root {
      --bg1: #26170d;
      --bg2: #52351d;
      --panel: rgba(255, 248, 220, 0.92);
      --text: #2c1609;
      --accent: #ffcc33;
      --danger: #d9361e;
      --good: #35a853;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--text);
      user-select: none;
      touch-action: manipulation;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 40px 40px,
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.10), transparent 24%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.18), transparent 35%);
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      pointer-events: none;
    }

    .pill, button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
    }

    .pill {
      min-width: 95px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      cursor: pointer;
      font-size: 14px;
    }

    button:active { transform: translateY(1px) scale(0.98); }

    .title-card {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.48);
    }

    .card {
      width: min(520px, 92vw);
      text-align: center;
      background: var(--panel);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 8vw, 54px);
      line-height: 0.95;
    }

    .subtitle {
      margin: 0 auto 20px;
      max-width: 420px;
      font-size: 17px;
      color: #684326;
    }

    .big-button {
      padding: 14px 24px;
      font-size: 20px;
      background: var(--accent);
      color: #221000;
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: #765235;
    }

    .roach {
      position: absolute;
      width: var(--size);
      height: calc(var(--size) * 1.42);
      transform: translate(-50%, -50%) rotate(var(--rot));
      transform-origin: center center;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      padding: 0;
      border-radius: 50%;
      box-shadow: none;
      backdrop-filter: none;
      filter: drop-shadow(0 9px 8px rgba(0,0,0,0.45));
      animation: bodyJitter 120ms infinite alternate ease-in-out;
    }

    .roach-body {
      position: absolute;
      inset: 0;
    }

    .roach-shell {
      position: absolute;
      inset: 18% 18% 8%;
      border-radius: 48% 48% 42% 42%;
      background:
        linear-gradient(90deg, transparent 46%, rgba(255,255,255,0.10) 49%, rgba(255,255,255,0.10) 51%, transparent 54%),
        radial-gradient(circle at 50% 14%, #553017 0 18%, transparent 19%),
        linear-gradient(120deg, #2a1208, #7b401e 45%, #2a1208);
      border: 2px solid #1b0904;
    }

    .roach-head {
      position: absolute;
      left: 32%;
      top: 5%;
      width: 36%;
      height: 25%;
      border-radius: 50% 50% 44% 44%;
      background: #211006;
      box-shadow: 0 -8px 0 -5px #0d0502;
    }

    .leg {
      position: absolute;
      width: 48%;
      height: 4px;
      background: #120603;
      border-radius: 999px;
      top: var(--top);
      opacity: 0.92;
      will-change: transform;
    }

    .leg.left {
      left: -22%;
      transform-origin: right center;
      animation: legSwingLeft 120ms infinite alternate ease-in-out;
      animation-delay: var(--delay);
    }

    .leg.right {
      right: -22%;
      transform-origin: left center;
      animation: legSwingRight 120ms infinite alternate ease-in-out;
      animation-delay: var(--delay);
    }

    .antenna {
      position: absolute;
      width: 42%;
      height: 3px;
      background: #100502;
      border-radius: 999px;
      top: 6%;
      will-change: transform;
    }

    .antenna.left {
      left: -6%;
      transform-origin: right center;
      animation: antLeft 220ms infinite alternate ease-in-out;
    }

    .antenna.right {
      right: -6%;
      transform-origin: left center;
      animation: antRight 220ms infinite alternate ease-in-out;
    }

    .dead {
      pointer-events: none;
      animation: squish 190ms ease-out forwards !important;
    }

    .dead .leg,
    .dead .antenna,
    .dead .roach-body {
      animation-play-state: paused !important;
    }

    .splat {
      position: absolute;
      z-index: 7;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(120, 35, 12, 0.75), transparent 18%),
        radial-gradient(circle at 65% 42%, rgba(120, 35, 12, 0.65), transparent 17%),
        radial-gradient(circle at 50% 62%, rgba(120, 35, 12, 0.72), transparent 24%);
      opacity: 0.75;
      animation: fadeSplat 1200ms ease-out forwards;
      pointer-events: none;
    }

    .floating-score {
      position: absolute;
      z-index: 25;
      transform: translate(-50%, -50%);
      color: #fff3b0;
      font-weight: 1000;
      font-size: 26px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: floatUp 650ms ease-out forwards;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: rgba(255,255,255,0.08);
      opacity: 0;
      pointer-events: none;
    }

    .flash.on { animation: flash 120ms ease-out; }

    @keyframes bodyJitter {
      from { margin-left: -1px; margin-top: -1px; }
      to { margin-left: 1px; margin-top: 1px; }
    }

    @keyframes legSwingLeft {
      0% { transform: rotate(calc(var(--angle) - 16deg)); }
      100% { transform: rotate(calc(var(--angle) + 16deg)); }
    }

    @keyframes legSwingRight {
      0% { transform: rotate(calc(var(--angle) + 16deg)); }
      100% { transform: rotate(calc(var(--angle) - 16deg)); }
    }

    @keyframes antLeft {
      from { transform: rotate(-52deg); }
      to { transform: rotate(-32deg); }
    }

    @keyframes antRight {
      from { transform: rotate(52deg); }
      to { transform: rotate(32deg); }
    }

    @keyframes squish {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
      60% { opacity: 0.95; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.18, 0.45); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.35, 0.18); }
    }

    @keyframes fadeSplat {
      0% { opacity: 0.82; transform: translate(-50%, -50%) scale(0.7); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    @keyframes floatUp {
      to { opacity: 0; transform: translate(-50%, -150%); }
    }

    @keyframes flash {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }

    @media (max-width: 520px) {
      .hud { align-items: flex-start; }
      .pill { min-width: auto; padding: 9px 11px; font-size: 13px; }
      button { padding: 9px 11px; font-size: 13px; }
      .controls { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Kill The Cockroach game area">
    <div class="hud">
      <div class="pill">🎯 Score: <span id="score">0</span></div>
      <div class="pill">📈 Level: <span id="level">1</span></div>
      <div class="pill">🪳 Alive: <span id="alive">0</span></div>
      <div class="controls">
        <button id="soundBtn" type="button" aria-pressed="true">🔊 Sound</button>
        <button id="pauseBtn" type="button">⏸️ Pause</button>
        <button id="restartBtn" type="button">🔁 Restart</button>
      </div>
    </div>

    <div id="flash" class="flash"></div>

    <section id="startScreen" class="title-card">
      <div class="card">
        <h1>🪳 Kill The Cockroach</h1>
        <p class="subtitle">Now the cockroaches move around the screen and their legs keep skittering. Tap them before they multiply.</p>
        <button id="startBtn" class="big-button" type="button">Start Game</button>
        <div class="hint">Works with mouse, touch, and trackpad. Sound and vibration are optional.</div>
      </div>
    </section>
  </main>

  <script>
    const game = document.getElementById('game');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const aliveEl = document.getElementById('alive');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const soundBtn = document.getElementById('soundBtn');
    const flash = document.getElementById('flash');

    let score = 0;
    let level = 1;
    let running = false;
    let paused = false;
    let soundOn = true;
    let spawnTimer = null;
    let audioContext = null;
    let animationFrameId = null;
    let lastTimestamp = 0;
    const roachState = new Map();

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getRoaches() {
      return Array.from(document.querySelectorAll('.roach:not(.dead)'));
    }

    function updateHud() {
      level = Math.floor(score / 10) + 1;
      scoreEl.textContent = score;
      levelEl.textContent = level;
      aliveEl.textContent = getRoaches().length;
    }

    function ensureAudio() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioContext = new AudioContext();
      }
    }

    function playPop() {
      if (!soundOn) return;
      ensureAudio();
      if (!audioContext) return;

      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function vibrate() {
      if ('vibrate' in navigator) navigator.vibrate(35);
    }

    function makeLeg(className, top, angle, delay) {
      const leg = document.createElement('span');
      leg.className = `leg ${className}`;
      leg.style.setProperty('--top', top);
      leg.style.setProperty('--angle', angle);
      leg.style.setProperty('--delay', delay);
      return leg;
    }

    function randomDirection(speed) {
      const angle = randomBetween(0, Math.PI * 2);
      return {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed
      };
    }

    function buildRoachVisual(roach) {
      const body = document.createElement('div');
      body.className = 'roach-body';

      const antLeft = document.createElement('span');
      antLeft.className = 'antenna left';
      const antRight = document.createElement('span');
      antRight.className = 'antenna right';
      const shell = document.createElement('span');
      shell.className = 'roach-shell';
      const head = document.createElement('span');
      head.className = 'roach-head';

      body.append(antLeft, antRight, shell, head);

      const tops = ['30%', '50%', '70%'];
      const angles = ['-24deg', '-6deg', '18deg'];
      const delays = ['0ms', '45ms', '85ms'];
      tops.forEach((top, index) => {
        body.append(makeLeg('left', top, angles[index], delays[index]));
        body.append(makeLeg('right', top, angles[index], delays[index]));
      });

      roach.appendChild(body);
    }

    function spawnRoach() {
      if (!running || paused) return;

      const maxAlive = clamp(4 + Math.floor(level * 1.7), 5, 32);
      if (getRoaches().length >= maxAlive) {
        scheduleNextSpawn();
        return;
      }

      const size = randomBetween(38, 76 + Math.min(level * 2.4, 32));
      const margin = size * 0.9;
      const x = randomBetween(margin, window.innerWidth - margin);
      const y = randomBetween(margin + 55, window.innerHeight - margin);
      const speed = randomBetween(45 + level * 5, 85 + level * 12);

      const roach = document.createElement('button');
      roach.className = 'roach';
      roach.type = 'button';
      roach.setAttribute('aria-label', 'Cockroach');
      roach.style.left = `${x}px`;
      roach.style.top = `${y}px`;
      roach.style.setProperty('--size', `${size}px`);
      roach.style.setProperty('--rot', '0deg');

      buildRoachVisual(roach);

      const direction = randomDirection(speed);
      roachState.set(roach, {
        x,
        y,
        size,
        speed,
        vx: direction.vx,
        vy: direction.vy,
        turnAt: performance.now() + randomBetween(350, 1200)
      });

      roach.addEventListener('pointerdown', killRoach, { once: true });
      game.appendChild(roach);
      updateHud();
      scheduleNextSpawn();
    }

    function updateRoach(roach, state, dt, now) {
      if (!document.body.contains(roach) || roach.classList.contains('dead')) return;

      const padding = state.size * 0.62;
      const topHudSpace = 72;
      const minX = padding;
      const maxX = window.innerWidth - padding;
      const minY = padding + topHudSpace;
      const maxY = window.innerHeight - padding;

      if (now >= state.turnAt) {
        const turn = randomBetween(-0.9, 0.9);
        const cos = Math.cos(turn);
        const sin = Math.sin(turn);
        const nextVx = state.vx * cos - state.vy * sin;
        const nextVy = state.vx * sin + state.vy * cos;
        const mag = Math.hypot(nextVx, nextVy) || state.speed;
        state.vx = nextVx / mag * state.speed;
        state.vy = nextVy / mag * state.speed;
        state.turnAt = now + randomBetween(300, Math.max(420, 1300 - level * 18));
      }

      state.x += state.vx * dt / 1000;
      state.y += state.vy * dt / 1000;

      if (state.x <= minX) {
        state.x = minX;
        state.vx = Math.abs(state.vx);
      } else if (state.x >= maxX) {
        state.x = maxX;
        state.vx = -Math.abs(state.vx);
      }

      if (state.y <= minY) {
        state.y = minY;
        state.vy = Math.abs(state.vy);
      } else if (state.y >= maxY) {
        state.y = maxY;
        state.vy = -Math.abs(state.vy);
      }

      const angleDeg = Math.atan2(state.vy, state.vx) * 180 / Math.PI + 90;
      roach.style.left = `${state.x}px`;
      roach.style.top = `${state.y}px`;
      roach.style.setProperty('--rot', `${angleDeg}deg`);
    }

    function gameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min(40, timestamp - lastTimestamp);
      lastTimestamp = timestamp;

      if (running && !paused) {
        roachState.forEach((state, roach) => updateRoach(roach, state, dt, timestamp));
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function killRoach(event) {
      if (!running || paused) return;
      event.preventDefault();
      event.stopPropagation();

      const roach = event.currentTarget;
      const rect = roach.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      roach.classList.add('dead');
      roachState.delete(roach);

      score += rect.width > 70 ? 2 : 1;
      playPop();
      vibrate();
      showSplat(x, y);
      showFloatingScore(x, y, rect.width > 70 ? '+2' : '+1');
      flash.classList.remove('on');
      void flash.offsetWidth;
      flash.classList.add('on');

      setTimeout(() => {
        roach.remove();
        updateHud();
      }, 200);
      updateHud();
    }

    function showSplat(x, y) {
      const splat = document.createElement('div');
      splat.className = 'splat';
      splat.style.left = `${x}px`;
      splat.style.top = `${y}px`;
      game.appendChild(splat);
      setTimeout(() => splat.remove(), 1250);
    }

    function showFloatingScore(x, y, text) {
      const label = document.createElement('div');
      label.className = 'floating-score';
      label.textContent = text;
      label.style.left = `${x}px`;
      label.style.top = `${y}px`;
      game.appendChild(label);
      setTimeout(() => label.remove(), 700);
    }

    function currentSpawnDelay() {
      return clamp(980 - level * 55, 160, 980);
    }

    function scheduleNextSpawn() {
      clearTimeout(spawnTimer);
      if (!running || paused) return;
      spawnTimer = setTimeout(spawnRoach, currentSpawnDelay());
    }

    function startGame() {
      ensureAudio();
      if (!animationFrameId) animationFrameId = requestAnimationFrame(gameLoop);
      running = true;
      paused = false;
      startScreen.style.display = 'none';
      pauseBtn.textContent = '⏸️ Pause';
      scheduleNextSpawn();
    }

    function restartGame() {
      clearTimeout(spawnTimer);
      document.querySelectorAll('.roach, .splat, .floating-score').forEach(el => el.remove());
      roachState.clear();
      score = 0;
      level = 1;
      running = true;
      paused = false;
      lastTimestamp = 0;
      startScreen.style.display = 'none';
      pauseBtn.textContent = '⏸️ Pause';
      updateHud();
      for (let i = 0; i < 3; i++) setTimeout(spawnRoach, i * 180);
      scheduleNextSpawn();
      if (!animationFrameId) animationFrameId = requestAnimationFrame(gameLoop);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶️ Resume' : '⏸️ Pause';
      if (paused) clearTimeout(spawnTimer);
      else {
        lastTimestamp = 0;
        scheduleNextSpawn();
      }
    }

    startBtn.addEventListener('click', () => {
      startGame();
      for (let i = 0; i < 3; i++) setTimeout(spawnRoach, i * 220);
    });

    restartBtn.addEventListener('click', restartGame);
    pauseBtn.addEventListener('click', togglePause);

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
      soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && running && !paused) togglePause();
    });

    window.addEventListener('resize', () => {
      roachState.forEach((state) => {
        state.x = clamp(state.x, state.size * 0.62, window.innerWidth - state.size * 0.62);
        state.y = clamp(state.y, state.size * 0.62 + 72, window.innerHeight - state.size * 0.62);
      });
    });

    updateHud();
  </script>
</body>
</html>
